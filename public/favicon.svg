  <polygon points="100.00,4.00 111.23,14.74 124.85,7.27 132.91,20.55 148.00,16.86 152.35,31.77 167.88,32.12 168.23,47.65 183.14,52.00 179.45,67.09 192.73,75.15 185.26,88.77 196.00,100.00 185.26,111.23 192.73,124.85 179.45,132.91 183.14,148.00 168.23,152.35 167.88,167.88 152.35,168.23 148.00,183.14 132.91,179.45 124.85,192.73 111.23,185.26 100.00,196.00 88.77,185.26 75.15,192.73 67.09,179.45 52.00,183.14 47.65,168.23 32.12,167.88 31.77,152.35 16.86,148.00 20.55,132.91 7.27,124.85 14.74,111.23 4.00,100.00 14.74,88.77 7.27,75.15 20.55,67.09 16.86,52.00 31.77,47.65 32.12,32.12 47.65,31.77 52.00,16.86 67.09,20.55 75.15,7.27 88.77,14.74" fill="#050505" stroke="white" stroke-width="4.5" stroke-linejoin="miter" />

